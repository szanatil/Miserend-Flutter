# Run with `flutter analyze`. Rules listed here are enforced by the analyzer,
# so CODING_STANDARDS.md does not repeat them.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_use_package_imports
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    # A write that is not awaited races the read after it; mark deliberate
    # fire-and-forget with unawaited().
    - unawaited_futures
