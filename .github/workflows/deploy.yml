name: Deploy

on:
  push:
    branches:
      - '*-rc'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Deploy channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  detect:
    name: Detect deploy channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      source_ref: ${{ steps.channel.outputs.source_ref }}
      branch: ${{ steps.channel.outputs.branch }}
    steps:
      - name: Determine channel and source ref
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_CHANNEL" = "release" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Manual release deploys are only allowed from the default branch"
              exit 1
            fi
            echo "channel=$INPUT_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == *-rc ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "channel=ci" >> "$GITHUB_OUTPUT"
            echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: Bump build number
    needs: detect
    if: needs.detect.outputs.channel != 'ci'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    env:
      PUSH_BRANCH: ${{ needs.detect.outputs.branch }}
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.detect.outputs.source_ref }}

      - name: Bump build number and push
        id: bump
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          line=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p' pubspec.yaml)
          read -r base current <<< "$line"
          if [ -z "${base:-}" ] || [ -z "${current:-}" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          new=$((current + 1))
          sed -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+[[:space:]]*$/version: ${base}+${new}/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          git add pubspec.yaml
          git commit -m "ci: bump build number to $new [skip ci]"

          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$PUSH_BRANCH"; then
              echo "Pushed build number $new to $PUSH_BRANCH"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push failed (attempt $attempt/10), syncing and retrying..."
            git fetch origin "$PUSH_BRANCH"
            git reset --hard "origin/$PUSH_BRANCH"
            line=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p' pubspec.yaml)
            read -r base current <<< "$line"
            new=$((current + 1))
            sed -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+[[:space:]]*$/version: ${base}+${new}/" pubspec.yaml > pubspec.yaml.tmp
            mv pubspec.yaml.tmp pubspec.yaml
            git add pubspec.yaml
            git commit -m "ci: bump build number to $new [skip ci]"
          done

          echo "Failed to push the build number bump after 10 attempts"
          exit 1

  build-ios:
    name: Build unsigned iOS app
    needs: [detect, bump]
    if: needs.bump.result == 'success'
    runs-on: macos-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: |
          set -euo pipefail
          (cd build/ios/iphoneos && zip -r -y "$GITHUB_WORKSPACE/miserend-ios-nosign.zip" Runner.app)

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: miserend-ios-nosign
          path: miserend-ios-nosign.zip
          if-no-files-found: error

  deploy-android:
    name: Deploy Android
    needs: [detect, bump]
    if: needs.bump.result == 'success'
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ needs.detect.outputs.channel == 'beta' && 'beta' || 'deploy' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      PLAY_STORE_JSON_KEY_FILE: play_store_key.json
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Decode Android signing credentials
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf '%s\n' 'storeFile=keystore.jks'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$PLAY_STORE_JSON_KEY" > android/play_store_key.json
          test -s android/app/keystore.jks
          test -s android/key.properties
          test -s android/play_store_key.json

      - name: Fastlane deploy
        working-directory: android
        run: bundle exec fastlane "$CHANNEL"

  deploy-ios:
    name: Deploy iOS
    needs: [detect, bump, build-ios]
    if: always() && needs.bump.result == 'success' && needs.build-ios.result == 'success'
    runs-on: macos-latest
    env:
      CHANNEL: ${{ needs.detect.outputs.channel == 'beta' && 'beta' || 'deploy' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Download unsigned iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: miserend-ios-nosign
          path: ios/

      - name: Decode App Store Connect API key
        working-directory: ios
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "AuthKey_${APPLE_API_KEY_ID}.p8"
          export APPLE_API_KEY_FILEPATH="$PWD/AuthKey_${APPLE_API_KEY_ID}.p8"
          bundle exec fastlane "$CHANNEL"
